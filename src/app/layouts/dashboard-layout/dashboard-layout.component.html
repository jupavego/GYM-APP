<div class="dash-shell" [class.dash-shell--sidebar-open]="sidebarOpen()">

  <!-- Sidebar -->
  <aside class="dash-sidebar">
    <div class="dash-sidebar__brand">
      <a routerLink="/" class="dash-sidebar__logo">{{ siteName }}</a>
    </div>

    <nav class="dash-sidebar__nav">
      @for (item of navItems(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="dash-sidebar__link--active"
          class="dash-sidebar__link"
          (click)="closeSidebar()"
        >
          <span class="dash-sidebar__icon">
            @switch (item.icon) {
              @case ('home') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              }
              @case ('account') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              }
              @case ('users') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              }
              @case ('fitness') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="M18 22l4-4"/><path d="M2 6l4-4"/><path d="M3 10l3-3"/><path d="M14 21l3-3"/></svg>
              }
            }
          </span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <button type="button" class="dash-sidebar__logout" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Cerrar sesión
    </button>
  </aside>

  <!-- Overlay móvil -->
  @if (sidebarOpen()) {
    <div class="dash-shell__overlay" (click)="closeSidebar()"></div>
  }

  <!-- Contenido -->
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" class="dash-topbar__menu-btn" (click)="toggleSidebar()" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="dash-topbar__spacer"></div>
      <app-user-widget />
    </header>

    <main class="dash-content">
      <router-outlet />
    </main>
  </div>

</div>
